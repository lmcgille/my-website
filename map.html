<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Map - NatureExplorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="solid">
        <a href="index.html" class="logo">NatureExplorer</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="parks.html">Explore Parks</a></li>
            <li><a href="map.html">Park Map</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1 style="text-align: center; color: #2c3e50; font-size: 2.5rem; margin-bottom: 2rem;">Interactive Park Map</h1>
        <div id="map"></div>
    </div>
    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 4,
                center: { lat: 39.8283, lng: -98.5795 }, // Center of USA
                styles: [
                    {
                        "featureType": "poi.park",
                        "elementType": "geometry.fill",
                        "stylers": [{ "color": "#c5e1a5" }]
                    }
                ]
            });

            const parks = [
                { name: "Yellowstone", lat: 44.4280, lng: -110.5885, file: "yellowstone.html" },
                { name: "Yosemite", lat: 37.8651, lng: -119.5383, file: "yosemite.html" },
                { name: "Banff", lat: 51.1784, lng: -115.5708, file: "banff.html" },
                { name: "Zion", lat: 37.3000, lng: -113.0000, file: "zion.html" },
                { name: "Grand Canyon", lat: 36.0651, lng: -112.1176, file: "grand-canyon.html" },
                { name: "Acadia", lat: 44.3386, lng: -68.2733, file: "acadia.html" }
            ];

            const bounds = new google.maps.LatLngBounds();

            parks.forEach(park => {
                const marker = new google.maps.Marker({
                    position: { lat: park.lat, lng: park.lng },
                    map: map,
                    title: park.name,
                    icon: {
                        url: "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
                    }
                });

                marker.addListener("click", () => {
                    window.location.href = park.file;
                });

                bounds.extend(marker.getPosition());
            });

            map.fitBounds(bounds);
        }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</body>
</html>

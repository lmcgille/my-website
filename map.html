<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Map - NatureExplorer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
    <nav class="solid">
        <a href="index.html" class="logo">NatureExplorer</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="parks.html">Explore Parks</a></li>
            <li><a href="map.html">Park Map</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1 style="text-align: center; color: #2c3e50; font-size: 2.5rem; margin-bottom: 2rem;">Interactive Park Map</h1>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const map = L.map('map').setView([39.8283, -98.5795], 4); // Center of USA

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
        }).addTo(map);

            const parks = [
                { name: "Yellowstone", lat: 44.4280, lng: -110.5885, file: "yellowstone.html" },
                { name: "Yosemite", lat: 37.8651, lng: -119.5383, file: "yosemite.html" },
                { name: "Banff", lat: 51.1784, lng: -115.5708, file: "banff.html" },
                { name: "Zion", lat: 37.3000, lng: -113.0000, file: "zion.html" },
                { name: "Grand Canyon", lat: 36.0651, lng: -112.1176, file: "grand-canyon.html" },
                { name: "Acadia", lat: 44.3386, lng: -68.2733, file: "acadia.html" }
            ];

            const markers = [];

            parks.forEach(park => {
                const marker = L.marker([park.lat, park.lng]).addTo(map);
                marker.bindPopup(`<b>${park.name}</b><br><a href="${park.file}">Explore Park</a>`);

                // Also add direct click navigation for a similar feel to the previous version
                marker.on('click', function() {
                    // Using a small timeout to allow the popup to open if needed,
                    // or just navigate immediately.
                    // window.location.href = park.file;
                });

                markers.push(marker);
            });

            const group = new L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.1));
        });
    </script>
</body>
</html>
